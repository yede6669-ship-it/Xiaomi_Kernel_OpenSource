name: Build Kernel

on:
  workflow_dispatch:   # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison flex libssl-dev libelf-dev \
          python3 make gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi zip

    - name: Download Clang toolchain
      run: |
        mkdir ~/clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20220717-release/Clang-14.0.6-20220717.tar.gz
        tar -xzf Clang-14.0.6-20220717.tar.gz -C ~/clang

    - name: Clone MTK kernel modules
      run: |
        git clone --depth=1 -b camellia-r-oss \
          https://github.com/MiCode/MTK_kernel_modules.git ../kernel_modules

    - name: Build kernel
      run: |
        export ARCH=arm64
        export PATH="~/clang/bin:$PATH"
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make ARCH=arm64 O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          camellia_defconfig

        make ARCH=arm64 O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          -j$(nproc)

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
        cp out/arch/arm64/boot/Image.gz-dtb AK3/
        sed -i 's/do.devicecheck=1/do.devicecheck=0/' AK3/anykernel.sh
        cd AK3 && zip -r9 ../kernel-camellia.zip * -x .git

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-camellia
        path: kernel-camellia.zip
        retention-days: 7
