name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Show directory structure
      run: |
        pwd
        ls -al

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          cpio \
          flex \
          libelf-dev \
          libssl-dev \
          lld \
          llvm \
          clang \
          pahole \
          zip \
          unzip

    - name: Fix duplicate symbol issue
      run: |
        FILE="drivers/media/platform/mtk-vcu/Makefile"

        if [ -f "$FILE" ]; then
          echo "Patching duplicate mtk_vcodec_mem.o..."

          awk '
          !seen[$0]++
          ' "$FILE" > temp_makefile

          mv temp_makefile "$FILE"
        fi

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1

        mkdir -p out

        make O=out camellia_user_defconfig

        make -j$(nproc) O=out

    - name: Show output files
      run: |
        echo "=== boot output ==="

        find out/arch/arm64/boot/ -type f | sort

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: camellia-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
