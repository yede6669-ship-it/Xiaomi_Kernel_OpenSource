name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 clang lld llvm

      - name: Build Kernel
        run: |
          # 1. 环境变量配置
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 2. 准备输出目录
          mkdir -p out
          
          # 3. 彻底清理并加载配置
          # 既然 Makefile 在根目录，直接在这里执行
          make O=out mrproper
          
          echo "正在加载配置: arch/arm64/configs/k6833v1_64_defconfig"
          if [ ! -f "arch/arm64/configs/k6833v1_64_defconfig" ]; then
            echo "错误：根目录下找不到该配置文件！"
            ls -R arch/arm64/configs/
            exit 1
          fi
          
          make O=out k6833v1_64_defconfig
          
          # 4. 正式开始编译 (使用所有核心加速)
          # 如果这里报错 "clang: command not found"，请告诉我
          make -j$(nproc --all) O=out \
              CC=$CC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Output
          path: out/arch/arm64/boot/Image*
