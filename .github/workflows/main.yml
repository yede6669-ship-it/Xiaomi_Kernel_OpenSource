name: Build Xiaomi Camellia Kernel (Legacy Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          # 补充了 flex, bison, gperf 等必不可少的工具
          sudo apt-get install -y bc bison flex gperf build-essential git libelf-dev libssl-dev python3 wget tar \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Legacy Android Clang (r383902)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang-10
          cd $GITHUB_WORKSPACE/clang-10
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz
          # 将 clang 路径加入环境变量
          echo "$GITHUB_WORKSPACE/clang-10/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          # 1. 环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang-10/bin:$PATH
          
          # 2. 准备输出
          mkdir -p out
          make O=out mrproper
          
          # 3. 加载配置
          make O=out k6833v1_64_defconfig
          
          # 4. 正式编译
          # 显式指定所有工具链路径，防止调用系统自带的新版 LLVM
          make -j$(nproc --all) O=out \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Legacy
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
