name: Aghisna R20 (Camellia Path Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python-is-python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Ready Compile
      run: |
          # 1. 深度清理和路径校正
          # 查找真正的 Makefile 所在目录
          MAKE_PATH=$(find . -maxdepth 3 -name "Makefile" -printf '%h' -quit)
          echo "Found Makefile in: $MAKE_PATH"
          
          # 如果 Makefile 不在当前根目录，则将该目录下的所有内容移动到根目录
          if [ "$MAKE_PATH" != "." ]; then
            echo "Moving source from $MAKE_PATH to root..."
            cp -r $MAKE_PATH/* .
          fi

          # 2. 下载并注入脚本
          curl -LSs https://raw.githubusercontent.com/RooGhz720/RooGhz720/main/rx/miui-r20.sh > miui-r20.sh
          chmod +x miui-r20.sh
          
          # 3. 强制适配 Camellia (红米Note 10 5G)
          # 检查是否存在 camellia_defconfig，如果不存在则报错提醒
          if [ ! -f "arch/arm64/configs/camellia_defconfig" ]; then
            echo "ERROR: camellia_defconfig not found in arch/arm64/configs/"
            ls arch/arm64/configs/
            exit 1
          fi

          sed -i 's/DEVICE="Redmi note 10 pro"/DEVICE="Redmi Note 10 5G"/g' miui-r20.sh
          sed -i 's/DEFCONFIG="sweet_defconfig"/DEFCONFIG="camellia_defconfig"/g' miui-r20.sh
          
          # 4. 修复 MTK 编译报错 & 阻止自动删除
          sed -i 's/rm -rf out/#rm -rf out/g' miui-r20.sh
          sed -i 's/rm -rf zip/#rm -rf zip/g' miui-r20.sh
          
          # 关键点：在脚本内 make $DEFCONFIG 之后精确插入补丁
          sed -i '/make "$DEFCONFIG" O=out/a \          sed -i "s/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g" out/.config\n          make O=out olddefconfig' miui-r20.sh

          # 5. 启动编译
          bash miui-r20.sh
      shell: bash
      env:
         CHATID: ${{ secrets.CHAT_ID }}
         API_BOT: ${{ secrets.BOT_API }}
         TYPE_KERNEL: ${{ secrets.EZA }}

    - name: Upload Camellia Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Camellia-Kernel-Result
        path: |
          zip/*.zip
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtbo.img
          error.log
