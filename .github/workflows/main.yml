name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 清理磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean && sudo apt-get autoremove -y
        df -h

    - name: 安装GCC-9和依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-9 g++-9 \
          gcc-9-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          bc bison build-essential curl flex git libssl-dev \
          wget python3 device-tree-compiler libncurses5-dev make

        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/aarch64-linux-gnu-gcc

    - name: 下载内核源码
      run: |
        cd $HOME
        wget -q --show-progress \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource/archive/refs/heads/camellia-r-oss.zip \
          -O kernel.zip
        unzip -q kernel.zip
        mv Xiaomi_Kernel_OpenSource-camellia-r-oss kernel
        rm kernel.zip

    - name: 配置内核并修复源码补丁
      run: |
        cd $HOME/kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        # 1. 生成基础配置
        make camellia_defconfig
        make olddefconfig

        # 2. 修复 ksm_flock 强制内联失败 (针对 GCC 9)
        sed -i 's/inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
        sed -i 's/inline void ksm_funlock/void ksm_funlock/g' include/linux/keyslot-manager.h

        # 3. 修复 clk-mux.h 找不到的问题 (针对 Mediatek 驱动)
        # 我们使用 find 命令查找所有可能引用该头文件的 c 文件，并将 < > 改为 " "
        # 这样编译器会先在当前驱动目录下搜索头文件
        find drivers/clk/mediatek/ -name "*.c" -exec sed -i 's/<clk-mux.h>/"clk-mux.h"/g' {} +
        
        echo "✅ 源码补丁应用完成"

    - name: 编译内核
      run: |
        cd $HOME/kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc-9
        export HOSTCXX=g++-9
        export KCFLAGS="-w"
        export KAFLAGS="-w"

        echo "===== 开始编译 ====="
        # 使用 tee 记录日志
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log || {
          echo "===== 尝试备选编译方案 ====="
          if [ ! -f "arch/arm64/boot/Image" ]; then
             make -j$(nproc) Image 2>&1 | tee -a build.log || true
          fi

          if [ -f "arch/arm64/boot/Image" ]; then
            gzip -c arch/arm64/boot/Image > arch/arm64/boot/Image.gz
            make -j$(nproc) dtbs || true
            DTB=$(find arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -1)
            [ -n "$DTB" ] && cat arch/arm64/boot/Image.gz "$DTB" > arch/arm64/boot/Image.gz-dtb
          fi
        }

        echo "===== 检查编译结果 ====="
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ 成功生成 Image.gz-dtb"
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "⚠️ 仅生成 Image (未合并 DTB)"
        else
          echo "❌ 编译失败！详细错误追踪如下："
          echo "-------------------- ERROR LOG START --------------------"
          grep -n -B 3 -A 3 -i -E "error:|fatal error:" build.log || tail -n 50 build.log
          echo "-------------------- ERROR LOG END ----------------------"
          exit 1
        fi

    - name: 上传错误日志 (仅在失败时)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: full-build-log
        path: ~/kernel/build.log

    - name: 打包产物
      if: success()
      run: |
        mkdir -p $HOME/output
        # 优先选择带 dtb 的版本
        for f in Image.gz-dtb Image.gz Image; do
          if [ -f "$HOME/kernel/arch/arm64/boot/$f" ]; then
            cp "$HOME/kernel/arch/arm64/boot/$f" $HOME/output/
            echo "已打包产物: $f"
            break
          fi
        done

    - name: 上传内核镜像
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Camellia-Fixed
        path: ~/output/*
