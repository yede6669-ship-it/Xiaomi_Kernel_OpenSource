# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 核心操作：在 Action 运行前，先手动把 Makefile 里的报错行删了
      - name: Pre-patch Makefile
        run: |
          # 提前创建一个占位目录并克隆 Makefile 进行修改，或者直接通过 shell 注入
          # 但最稳妥的方法是利用这个 Action 会在当前目录工作的特性
          mkdir -p msm-4.14
          git clone --depth 1 -b camellia-r-oss https://github.com/MiCode/Xiaomi_Kernel_OpenSource msm-4.14
          cd msm-4.14
          sed -i 's/$(error "Clang with Android --target detected. Did you specify CLANG_TRIPLE?").*//g' Makefile

      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          # 注意：这里我们依然保留你的 with 结构
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          kernel-dir: msm-4.14
          kernel-branch: camellia-r-oss
          config: k6833v1_64_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
          # 这里保留你最后给我的内容
          extra-make-args: |
            CLANG_TRIPLE=aarch64-linux-gnu-
            cc-name=gcc
