name: Build Camellia Kernel (Stable CI)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel
      OUT_DIR: ${{ github.workspace }}/kernel/out
      TOOLS_DIR: ${{ github.workspace }}/tools

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libncurses-dev bison flex libssl-dev curl unzip wget git

      - name: Download example boot.img
        run: |
          mkdir -p $OUT_DIR
          cd $OUT_DIR
          # 示例 boot.img，你可以后续替换成自己机型的 boot.img
          curl -L -o boot.img https://example.com/boot.img

      - name: Clone mkbootimg_tools
        run: |
          # 浅克隆避免认证问题
          git clone --depth=1 https://github.com/osm0sis/mkbootimg_tools.git $TOOLS_DIR

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=$OUT_DIR camellia_defconfig
          make -j$(nproc) O=$OUT_DIR

      - name: Check boot image
        run: |
          ls -lh $OUT_DIR
          file $OUT_DIR/Image
          file $OUT_DIR/dtbo.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: |
            $OUT_DIR/Image
            $OUT_DIR/dtbo.img
