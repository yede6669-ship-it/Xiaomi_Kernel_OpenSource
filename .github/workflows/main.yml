name: Aghisna R20 Camellia Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python-is-python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Build Kernel
      run: |
          # 1. 下载脚本
          curl -LSs https://raw.githubusercontent.com/RooGhz720/RooGhz720/main/rx/miui-r20.sh > miui-r20.sh
          chmod +x miui-r20.sh
          
          # 2. 修改脚本参数以适配你的机型
          # 将默认的 Pro 机型改为你的 5G 版机型
          sed -i 's/DEVICE="Redmi note 10 pro"/DEVICE="Redmi Note 10 5G"/g' miui-r20.sh
          sed -i 's/DEFCONFIG="sweet_defconfig"/DEFCONFIG="camellia_defconfig"/g' miui-r20.sh
          
          # 3. 核心修复：阻止编译完成后自动删除文件夹（否则你下载不到产物）
          sed -i 's/rm -rf out/#rm -rf out/g' miui-r20.sh
          sed -i 's/rm -rf zip/#rm -rf zip/g' miui-r20.sh
          
          # 4. 修复联发科 MTK 源码在 GitHub 环境下的堆栈保护报错
          # 在脚本执行 make $DEFCONFIG 之后立即注入禁用命令
          sed -i '/make "$DEFCONFIG" O=out/a \          sed -i "s/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g" out/.config\n          make O=out olddefconfig' miui-r20.sh

          # 5. 执行编译
          bash miui-r20.sh
      shell: bash
      env:
         CHATID: ${{ secrets.CHAT_ID }}
         API_BOT: ${{ secrets.BOT_API }}
         TYPE_KERNEL: "Camellia-OSS"

    - name: Upload Kernel Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Camellia-Kernel-Package
        # 捕获所有可能的产物
        path: |
          zip/*.zip
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtbo.img
          error.log
