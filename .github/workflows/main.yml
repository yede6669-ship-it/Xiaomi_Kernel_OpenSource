# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          kernel-dir: msm-4.14
          kernel-branch: camellia-r-oss
          # 就在这里！利用 $(...) 在执行 config 之前强行删掉报错行
          config: $(sed -i 's/$(error "Clang with Android --target detected. Did you specify CLANG_TRIPLE?").*//g' Makefile) k6833v1_64_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 11
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
          # 依然保留这个，防止 Makefile 其他地方也检查这个变量
          extra-make-args: CLANG_TRIPLE=aarch64-linux-gnu-
