name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: camellia-r-oss
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          cpio \
          flex \
          libelf-dev \
          libssl-dev \
          clang \
          llvm \
          lld \
          pahole \
          zip \
          unzip

    - name: Verify source tree
      run: |
        echo "=== ROOT ==="
        ls -al

        echo "=== ARCH CONFIGS ==="
        find arch/arm64/configs -type f | head -30

    - name: Fix MTK duplicate issue
      run: |
        FILE="drivers/media/platform/mtk-vcu/Makefile"

        if [ -f "$FILE" ]; then
          awk '!seen[$0]++' "$FILE" > temp_makefile
          mv temp_makefile "$FILE"
        fi

    - name: Detect defconfig
      run: |
        DEFCONFIG=$(find arch/arm64/configs -type f | grep -Ei \
        'camellia|k69|mt68|gki|vendor' | head -n 1)

        echo "FOUND=$DEFCONFIG"

        if [ -z "$DEFCONFIG" ]; then
          echo "No defconfig found!"
          exit 1
        fi

        basename "$DEFCONFIG" > defconfig.txt

        echo "USING=$(cat defconfig.txt)"

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1

        mkdir -p out

        DEFCONFIG=$(cat defconfig.txt)

        make O=out "$DEFCONFIG"

        make -j$(nproc) O=out

    - name: Show outputs
      run: |
        echo "=== OUTPUT FILES ==="

        find out/arch/arm64/boot/ -type f | sort || true

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: camellia-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
