name: Build Camellia Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make bc bison build-essential curl flex git \
            libssl-dev libelf-dev python3 cpio kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            liblz4-tool xz-utils zlib1g-dev libncurses5-dev
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download AOSP Clang r416183b
        run: |
          git clone --depth=1 --single-branch \
            --branch 11 \
            https://github.com/Corvus-AOSP/android_prebuilts_clang_host_linux-x86_clang-r416183b \
            ${{ github.workspace }}/clang
          ${{ github.workspace }}/clang/bin/clang --version | head -1

      - name: Create assembler wrappers
        run: |
          mkdir -p ${{ github.workspace }}/wrapper
          CLANG=${{ github.workspace }}/clang/bin/clang

          # 用 python3 写文件，完全避免 shell heredoc 和 YAML 转义问题
          python3 - <<'PYEOF'
import os, stat

clang = os.environ.get('CLANG', '${{ github.workspace }}/clang/bin/clang')
wrapper_dir = '${{ github.workspace }}/wrapper'
os.makedirs(wrapper_dir, exist_ok=True)

# as wrapper: ARM调用转clang，x86走系统as
as_script = '''#!/bin/bash
IS_ARM=0
for arg in "$@"; do
  case "$arg" in
    -EL|-EB|--target=aarch64*|--target=arm*) IS_ARM=1 ;;
  esac
done
if [ "$IS_ARM" = "1" ]; then
  exec {clang} --target=aarch64-linux-gnu -c "$@"
else
  exec /usr/bin/as "$@"
fi
'''.format(clang=clang)

# aarch64 wrapper
aarch64_script = '''#!/bin/bash
ARGS=()
for arg in "$@"; do
  case "$arg" in
    -EL|-EB) ;;
    *) ARGS+=("$arg") ;;
  esac
done
exec {clang} --target=aarch64-linux-gnu -c "${{ARGS[@]}}"
'''.format(clang=clang)

# arm32 wrapper
arm32_script = '''#!/bin/bash
ARGS=()
for arg in "$@"; do
  case "$arg" in
    -EL|-EB) ;;
    *) ARGS+=("$arg") ;;
  esac
done
exec {clang} --target=arm-linux-gnueabihf -c "${{ARGS[@]}}"
'''.format(clang=clang)

files = {
  'as': as_script,
  'aarch64-linux-gnu-as': aarch64_script,
  'arm-linux-gnueabihf-as': arm32_script,
}

for name, content in files.items():
  path = os.path.join(wrapper_dir, name)
  with open(path, 'w') as f:
    f.write(content)
  os.chmod(path, os.stat(path).st_mode | stat.S_IEXEC | stat.S_IXGRP | stat.S_IXOTH)
  print(f'Created: {path}')

PYEOF
          echo "=== Wrapper check ==="
          cat ${{ github.workspace }}/wrapper/as
          echo "---"
          ls -la ${{ github.workspace }}/wrapper/

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="${{ github.workspace }}/wrapper:${{ github.workspace }}/clang/bin:$PATH"
          export KCFLAGS="-w"
          export KCPPFLAGS="-w"

          ARGS="O=out
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            LLVM_IAS=0"

          echo "=== Tool check ==="
          clang --version | head -1
          which as

          echo "=== defconfig ==="
          make $ARGS camellia_defconfig

          echo "=== Fix stackprotector ==="
          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable  CONFIG_CC_STACKPROTECTOR_NONE
          make $ARGS olddefconfig

          echo "=== Building ==="
          make $ARGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== Exit: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERRORS ==="
            grep "error:" build.log | grep -v "^#" | head -80 || true
            echo "=== LAST 200 LINES ==="
            tail -200 build.log
            exit $BUILD_EXIT
          fi

      - name: Check output
        if: always()
        run: |
          df -h
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "not found"
          find kernel/out -name "Image*" 2>/dev/null || true

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3