name: Build Camellia Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLANG_DIR: ${{ github.workspace }}/toolchain/clang

jobs:
  build:
    name: Build Kernel (camellia-r-oss)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            make bc bison build-essential ccache curl flex \
            git gnupg gperf wget tar \
            liblz4-tool libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush \
            rsync libglib2.0-dev schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip cpio kmod ca-certificates \
            zstd patchelf device-tree-compiler
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download Clang toolchain via AntMan
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          cd ${{ env.CLANG_DIR }}
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          bin/clang --version | head -1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: camellia-r-oss-${{ runner.os }}

      - name: Build kernel
        working-directory: kernel
        run: |
          WRAPPER_DIR="${{ github.workspace }}/wrapper"
          mkdir -p "$WRAPPER_DIR"

          # 调试版 wrapper：打印实际调用，再转发给 llvm-as（通过 clang -x assembler）
          cat > "$WRAPPER_DIR/aarch64-linux-gnu-as" << WRAPPER_EOF
          #!/bin/sh
          echo "[WRAPPER aarch64-linux-gnu-as] args: $@" >&2
          exec "${{ env.CLANG_DIR }}/bin/clang" --target=aarch64-linux-gnu -x assembler "$@"
          WRAPPER_EOF

          cat > "$WRAPPER_DIR/arm-linux-gnueabihf-as" << WRAPPER_EOF
          #!/bin/sh
          echo "[WRAPPER arm-linux-gnueabihf-as] args: $@" >&2
          exec "${{ env.CLANG_DIR }}/bin/clang" --target=arm-linux-gnueabihf -x assembler "$@"
          WRAPPER_EOF

          # 裸 as wrapper：判断参数，如果含 -EL/-EB 说明是 aarch64 target，转 clang；否则转系统 as
          cat > "$WRAPPER_DIR/as" << WRAPPER_EOF
          #!/bin/sh
          echo "[WRAPPER as] args: $@" >&2
          for arg in "$@"; do
            case "\$arg" in
              -EL|-EB)
                echo "[WRAPPER as] detected aarch64/arm target, redirecting to clang" >&2
                exec "${{ env.CLANG_DIR }}/bin/clang" --target=aarch64-linux-gnu -x assembler "$@"
                ;;
            esac
          done
          echo "[WRAPPER as] detected host target, using system as" >&2
          exec /usr/bin/as "$@"
          WRAPPER_EOF

          chmod +x "$WRAPPER_DIR/aarch64-linux-gnu-as"
          chmod +x "$WRAPPER_DIR/arm-linux-gnueabihf-as"
          chmod +x "$WRAPPER_DIR/as"

          export PATH="$WRAPPER_DIR:${{ env.CLANG_DIR }}/bin:${PATH}"

          COMMON_FLAGS="O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            HOSTAS=/usr/bin/as \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            DTC_EXT=dtc"

          make $COMMON_FLAGS camellia_defconfig

          # V=1 输出完整命令，方便诊断
          make $COMMON_FLAGS V=1 -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== Build exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERRORS AND WARNINGS ==="
            grep -n -E "\[WRAPPER\]|error:|Error|fatal:|failed" build.log | head -150 || true
            exit $BUILD_EXIT
          fi

      - name: Check build output
        if: always()
        run: |
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "boot dir not found"
          find kernel/out -name "Image*" 2>/dev/null || echo "No Image files found"

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
