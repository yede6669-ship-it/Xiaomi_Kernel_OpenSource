- name: Patch kernel source
        working-directory: kernel
        run: |
          echo ">>> [1] 修复 -Werror：整体删除 -Werror 及其 =xxx 变体"
          # 必须同时处理两种形式：
          #   -Werror=something  →  整体删除
          #   -Werror（独立）    →  删除
          find . \( -name "Makefile" -o -name "Kbuild" \) | \
            xargs sed -i \
              -e 's/-Werror=[^ \t]*//g' \
              -e 's/-Werror\b//g'

          echo ">>> [2] 注释掉 stackprotector exit 1"
          python3 -c "
          with open('Makefile', 'r') as f:
              lines = f.readlines()
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if 'Cannot use CONFIG_CC_STACKPROTECTOR' in line and 'exit 1' in line:
                  out.append('# PATCHED: ' + line)
              elif 'Cannot use CONFIG_CC_STACKPROTECTOR' in line:
                  out.append('# PATCHED: ' + line)
                  if i + 1 < len(lines) and 'exit 1' in lines[i + 1]:
                      i += 1
                      out.append('# PATCHED: ' + lines[i])
              else:
                  out.append(line)
              i += 1
          with open('Makefile', 'w') as f:
              f.writelines(out)
          patched = [l for l in out if 'PATCHED' in l]
          print(f'Patched {len(patched)} line(s)')
          for l in patched:
              print(' ', l.rstrip())
          "

          echo ">>> 验证：确认没有残留的裸 =xxx 参数"
          grep -rn -- '=implicit-function-declaration\|=unknown-warning' \
            --include="Makefile" --include="Kbuild" . || echo "OK: 无残留"