name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch: # 建议手动触发，方便调试

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia # 关键：强制切换到山茶花分支
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 clang lld llvm

      - name: Find Makefile and Build
        run: |
          # 1. 自动定位 Makefile 所在的目录
          MAKE_PATH=$(find . -maxdepth 3 -name Makefile -print -quit | xargs dirname)
          
          if [ -z "$MAKE_PATH" ]; then
            echo "错误：在仓库中完全找不到 Makefile！请检查 camellia 分支是否有代码。"
            ls -R
            exit 1
          fi
          
          echo "找到 Makefile 位于: $MAKE_PATH"
          cd "$MAKE_PATH"

          # 2. 准备输出目录
          mkdir -p out
          
          # 3. 定义环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 4. 开始构建
          make O=out mrproper
          
          # 5. 配置 (请确保此文件名在 arch/arm64/configs/ 下)
          make O=out k6833v1_64_defconfig
          
          # 6. 编译
          make -j$(nproc --all) O=out \
              CC=$CC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: "**/out/arch/arm64/boot/Image*"
