name: Build Camellia Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make bc bison build-essential curl flex \
            git libssl-dev libelf-dev \
            python3 python3-pip cpio kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            liblz4-tool xz-utils zlib1g-dev libncurses5-dev \
            zstd
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download Neutron Clang
        run: |
          mkdir -p ${{ github.workspace }}/clang

          # 用官方脚本获取最新 Neutron Clang
          # 先尝试获取 catalogue JSON 找最新版本
          CATALOGUE_URL="https://raw.githubusercontent.com/Neutron-Toolchains/clang-build-catalogue/main/catalogue.json"
          
          echo "Fetching catalogue..."
          CATALOGUE=$(curl -fsSL "$CATALOGUE_URL" || echo "")

          if [ -n "$CATALOGUE" ]; then
            # 从 catalogue 取最新 tag
            LATEST_TAG=$(echo "$CATALOGUE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          # catalogue 是个列表，取第一个（最新）
          if isinstance(data, list):
              print(data[0].get('tag_name', data[0].get('name', '')))
          elif isinstance(data, dict):
              keys = list(data.keys())
              print(keys[0] if keys else '')
          " 2>/dev/null || echo "")
            echo "Latest tag from catalogue: $LATEST_TAG"
          fi

          # 直接用已知可用的稳定版本下载
          # antman 是 Neutron 官方提供的下载脚本
          cd ${{ github.workspace }}/clang
          
          echo "Downloading via antman script..."
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          
          # antman -S 同步/下载最新版本
          bash antman -S || {
            echo "antman failed, trying direct download..."
            
            # 备用：直接下载已知有效的版本
            # 使用 GitHub API 获取最新 release
            LATEST=$(curl -fsSL "https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest" \
              | python3 -c "import sys,json; r=json.load(sys.stdin); print(r['tag_name'])" 2>/dev/null || echo "")
            
            echo "Latest release tag: $LATEST"
            
            if [ -n "$LATEST" ]; then
              ASSET_URL=$(curl -fsSL "https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest" \
                | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          for a in r.get('assets', []):
              if a['name'].endswith('.tar.zst'):
                  print(a['browser_download_url'])
                  break
          " 2>/dev/null || echo "")
              
              echo "Asset URL: $ASSET_URL"
              
              if [ -n "$ASSET_URL" ]; then
                curl -L --progress-bar "$ASSET_URL" -o neutron-clang.tar.zst
                tar --use-compress-program=unzstd -xf neutron-clang.tar.zst
                rm neutron-clang.tar.zst
              fi
            fi
          }

          echo "=== Clang check ==="
          ls bin/ | head -10
          bin/clang --version | head -1

      - name: Build kernel
        working-directory: kernel
        run: |
          export CLANG_PATH="${{ github.workspace }}/clang/bin"
          export PATH="$CLANG_PATH:$PATH"

          export KCFLAGS="-w"
          export KCPPFLAGS="-w"

          ARGS="O=out
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            LLVM_IAS=0"

          make $ARGS camellia_defconfig

          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable  CONFIG_CC_STACKPROTECTOR_NONE

          make $ARGS olddefconfig

          make $ARGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERRORS ==="
            grep "error:" build.log | grep -v "^#" | head -80
            echo "=== LAST 200 LINES ==="
            tail -200 build.log
            exit $BUILD_EXIT
          fi

      - name: Check output
        if: always()
        run: |
          df -h
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "not found"

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
