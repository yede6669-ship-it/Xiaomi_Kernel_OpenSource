name: Aghisna R20 Camellia Final Strike

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: camellia-r-oss
        fetch-depth: 1

    - name: Setup Environment
      run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python-is-python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Build Kernel
      run: |
          # 1. 结构重组
          if [ ! -f "Makefile" ]; then
            M_PATH=$(find . -name "Makefile" -printf '%h' -quit)
            [ -n "$M_PATH" ] && cp -af $M_PATH/. .
          fi

          # 2. 下载编译脚本
          curl -LSs https://raw.githubusercontent.com/RooGhz720/RooGhz720/main/rx/miui-r20.sh > miui-r20.sh
          chmod +x miui-r20.sh
          
          # 3. 预下载 Clang 并清理坏掉的汇编器
          bash miui-r20.sh & sleep 60 && kill $! || true
          rm -rf /home/runner/clang/bin/as
          rm -rf /home/runner/clang/bin/aarch64-linux-gnu-as
          rm -rf /home/runner/clang/bin/arm-linux-gnueabi-as

          # 4. 【核心修复】解决 cfi.c 报错 + 强制 LLVM 模式
          # 我们把 -Wno-int-conversion 注入到全局配置，让新版 Clang 宽容旧代码
          sed -i '1i LLVM := 1' Makefile
          sed -i '1i LLVM_IAS := 1' Makefile
          sed -i '/^KBUILD_CFLAGS/ s/$/ -Wno-error=int-conversion -Wno-error=implicit-function-declaration/' Makefile

          # 5. 适配机型参数并禁用清理
          sed -i 's/DEVICE="Redmi note 10 pro"/DEVICE="Redmi Note 10 5G"/g' miui-r20.sh
          sed -i 's/DEFCONFIG="sweet_defconfig"/DEFCONFIG="camellia_defconfig"/g' miui-r20.sh
          sed -i 's/rm -rf out/#rm -rf out/g' miui-r20.sh
          sed -i 's/rm -rf zip/#rm -rf zip/g' miui-r20.sh
          
          # 6. 注入 MTK 堆栈补丁
          sed -i '/make "$DEFCONFIG" O=out/a \          sed -i "s/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g" out/.config\n          make O=out LLVM=1 LLVM_IAS=1 olddefconfig' miui-r20.sh
          
          # 7. 强力执行
          export PATH="/home/runner/clang/bin:$PATH"
          # 显式传递 KCFLAGS 确保容错参数生效
          bash miui-r20.sh LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error=int-conversion"
      shell: bash
      env:
         CHATID: ${{ secrets.CHAT_ID }}
         API_BOT: ${{ secrets.BOT_API }}

    - name: Upload Result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Camellia-Built-Kernel
        path: |
          zip/*.zip
          out/arch/arm64/boot/Image*
          out/arch/arm64/boot/dtbo.img
