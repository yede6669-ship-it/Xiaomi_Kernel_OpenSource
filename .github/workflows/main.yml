name: Build Xiaomi Camellia Kernel (Docker Mode)

on:
  workflow_dispatch:

jobs:
  build:
    # 依然运行在 ubuntu 机器上，但指令会在下方的 container 内部执行
    runs-on: ubuntu-latest
    container:
      # 使用专门针对安卓编译优化的镜像（Debian系），环境更接近四年前的开发机
      image: docker.io/lineageos47/lineageos-build:latest 

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Legacy Clang
        run: |
          apt-get update && apt-get install -y wget tar
          mkdir -p /build/clang
          cd /build/clang
          # 下载更老的、兼容性最强的 Android 10/11 时代 Clang (r353983c)
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r353983c.tar.gz
          tar -xf clang-r353983c.tar.gz

      - name: Build Kernel
        run: |
          # 1. 设置环境变量，强制指向我们下载的旧版 Clang
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=/build/clang/bin:$PATH
          
          # 2. 准备输出
          mkdir -p out
          make O=out mrproper
          
          # 3. 加载配置
          make O=out k6833v1_64_defconfig
          
          # 4. 编译
          # 如果源码太老，有时需要屏蔽掉一些新版编译器不认识的 flag
          make -j$(nproc --all) O=out \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Docker
          path: |
            **/out/arch/arm64/boot/Image*
            **/out/arch/arm64/boot/dtbo.img
