name: Build Camellia Kernel (Stable)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex build-essential curl git \
            libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler

      # ✅ 用稳定 toolchain（不要 AntMan）
      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Setup env
        run: |
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH=$CLANG_PATH:$PATH

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=0

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-

          mkdir -p out

          echo ">>> defconfig"
          make O=out camellia_defconfig

          echo ">>> build"
          make -j$(nproc) O=out 2>&1 | tee build.log

      - name: Check output
        run: |
          ls -lh kernel/out/arch/arm64/boot/ || true
          find kernel/out -name "Image*" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
