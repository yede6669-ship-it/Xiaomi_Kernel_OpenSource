name: Build Original Kernel (Camellia)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 更新为可用版本
    timeout-minutes: 120

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 清理磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean && sudo apt-get autoremove -y

    - name: 安装GCC-8和依赖
      run: |
        # 由于ubuntu-22.04默认源没有gcc-8，需要添加ubuntu-20.04的源
        echo "deb http://dk.archive.ubuntu.com/ubuntu/ focal main universe" | sudo tee -a /etc/apt/sources.list
        echo "deb http://dk.archive.ubuntu.com/ubuntu/ focal-updates main universe" | sudo tee -a /etc/apt/sources.list
        
        sudo apt update
        # 安装gcc-8及其交叉编译器，同时保留内核编译必需依赖
        sudo apt install -y gcc-8 g++-8 gcc-8-aarch64-linux-gnu g++-8-aarch64-linux-gnu \
          bc bison build-essential curl flex git libssl-dev libelf-dev \
          wget python3 device-tree-compiler libncurses5-dev make cpio

        # 强制设置gcc-8优先级
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 80
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-8 80

    - name: 下载源码
      run: |
        cd $HOME
        wget -q --show-progress \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource/archive/refs/heads/camellia-r-oss.zip \
          -O kernel.zip
        unzip -q kernel.zip
        mv Xiaomi_Kernel_OpenSource-camellia-r-oss kernel
        rm kernel.zip

    - name: 修复内核源码问题
      run: |
        cd $HOME/kernel
        echo "===== 修复 MTK 源码头文件问题 ====="
        # 修复头文件包含路径问题
        find . -type f -name "*.c" -exec grep -l "dt_idle_states.h" {} \; | while read file; do
          sed -i 's/#include <dt_idle_states\.h>/#include "dt_idle_states.h"/g' "$file"
        done

        find drivers/clk -type f -name "*.c" -exec grep -l "clk-mux.h" {} \; | while read file; do
          sed -i 's/#include <clk-mux\.h>/#include "clk-mux.h"/g' "$file"
        done

        # 建立关键目录链接，防止某些 MTK 驱动编译时找不到 plat 目录
        mkdir -p include/mach
        ln -sf $(pwd)/drivers/misc/mediatek/include/mt-plat/include/mach include/mach

    - name: 配置内核
      run: |
        cd $HOME/kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        
        make camellia_defconfig

        # 针对新环境/旧源码的稳定性修正
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' .config
        echo "CONFIG_IKHEADERS=n" >> .config
        
        make olddefconfig

    - name: 编译内核
      run: |
        cd $HOME/kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc-8
        export HOSTCC=gcc-8
        export HOSTCXX=g++-8
        export KCFLAGS="-w"

        echo "===== 开始编译 Image.gz-dtb ====="
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log || {
          echo "编译失败，最后 100 行日志："
          tail -n 100 build.log
          exit 1
        }

    - name: 整理产物
      run: |
        mkdir -p output
        if [ -f "$HOME/kernel/arch/arm64/boot/Image.gz-dtb" ]; then
          cp "$HOME/kernel/arch/arm64/boot/Image.gz-dtb" output/
        fi

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: Original-Kernel-Camellia
        path: output/
