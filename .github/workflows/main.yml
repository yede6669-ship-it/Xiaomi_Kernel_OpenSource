name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 clang lld llvm

      - name: Build Kernel
        run: |
          # 1. 精确寻找内核主目录 (寻找包含 Makefile 且包含 arch 文件夹的目录)
          SRC_DIR=$(find . -maxdepth 3 -name "Makefile" -exec test -e "{}/../arch" \; -print -quit | xargs dirname)
          
          # 如果上面没找到，尝试保底方案：直接检查当前目录
          if [ -z "$SRC_DIR" ]; then
            if [ -f "./Makefile" ]; then
                SRC_DIR="."
            else
                echo "错误：找不到内核主源码目录！"
                ls -R
                exit 1
            fi
          fi
          
          cd "$SRC_DIR"
          echo "工作目录已切换至内核根目录: $(pwd)"

          # 2. 设置环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 3. 准备输出目录
          mkdir -p out
          
          # 4. 彻底清理
          make O=out mrproper
          
          # 5. 配置 (小米山茶花)
          # 注意：如果在这一步报错 "No such file"，说明文件名可能不叫这个
          make O=out k6833v1_64_defconfig
          
          # 6. 编译
          make -j$(nproc --all) O=out \
              CC=$CC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Output
          path: "**/out/arch/arm64/boot/Image*"
