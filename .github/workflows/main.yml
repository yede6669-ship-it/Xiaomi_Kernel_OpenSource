- name: Patch kernel source
        working-directory: kernel
        run: |
          echo ">>> [1] 用 Python 安全删除 -Werror 系列标志"
          python3 -c "
          import re, os, sys

          def safe_remove_werror(text):
              # 只删除独立的 -Werror 标志，不能动 \$(call ...) 里面的内容
              # 策略：逐个 token 扫描，跳过包含 \$( 的 token
              result = []
              for token in text.split(' '):
                  # 如果 token 包含 Makefile 变量展开，原样保留
                  if '\$(') in token:
                      result.append(token)
                  # 删除 -Werror=xxx 和独立 -Werror
                  elif re.match(r'^-Werror(=[^\s]*)?$', token):
                      pass  # 丢弃
                  else:
                      result.append(token)
              return ' '.join(result)

          makefiles = []
          for root, dirs, files in os.walk('.'):
              # 跳过 .git
              dirs[:] = [d for d in dirs if d != '.git']
              for fname in files:
                  if fname in ('Makefile', 'Kbuild') or fname.endswith('.mk'):
                      makefiles.append(os.path.join(root, fname))

          changed = 0
          for path in makefiles:
              try:
                  with open(path, 'r', errors='replace') as f:
                      original = f.read()
                  new = safe_remove_werror(original)
                  if new != original:
                      with open(path, 'w') as f:
                          f.write(new)
                      changed += 1
              except Exception as e:
                  print('skip', path, e)
          print(str(changed) + ' file(s) modified')
          "

          echo ">>> [2] 注释掉 stackprotector exit 1"
          python3 -c "
          with open('Makefile', 'r') as f:
              lines = f.readlines()
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if 'Cannot use CONFIG_CC_STACKPROTECTOR' in line and 'exit 1' in line:
                  out.append('# PATCHED: ' + line)
              elif 'Cannot use CONFIG_CC_STACKPROTECTOR' in line:
                  out.append('# PATCHED: ' + line)
                  if i + 1 < len(lines) and 'exit 1' in lines[i + 1]:
                      i += 1
                      out.append('# PATCHED: ' + lines[i])
              else:
                  out.append(line)
              i += 1
          with open('Makefile', 'w') as f:
              f.writelines(out)
          patched = [l for l in out if 'PATCHED' in l]
          print(str(len(patched)) + ' line(s) patched')
          for l in patched:
              print(l.rstrip())
          "

          echo ">>> [3] 验证 Makefile 括号完整性"
          python3 -c "
          with open('Makefile', 'r') as f:
              content = f.read()
          depth = 0
          for i, ch in enumerate(content):
              if ch == '(':
                  depth += 1
              elif ch == ')':
                  depth -= 1
          print('bracket depth at EOF:', depth, '(should be 0)')
          "