name: Stable Xiaomi Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DIR: .
      OUT_DIR: out

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    # =========================
    # INSTALL TOOLCHAIN (SAFE)
    # =========================
    - name: Install LLVM (stable system)
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev libelf-dev \
          build-essential git curl wget \
          clang llvm lld

        clang --version
        ld.lld --version

    # =========================
    # FIND DEFCONFIG
    # =========================
    - name: Detect defconfig
      run: |
        echo "=== scanning defconfigs ==="

        DEFCONFIG=$(find arch/arm64/configs -name "*camellia*defconfig" | head -n 1)

        if [ -z "$DEFCONFIG" ]; then
          DEFCONFIG=$(find arch/arm64/configs -name "defconfig" | head -n 1)
        fi

        echo "Using: $DEFCONFIG"
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

    # =========================
    # FIX MTK VCU DUPLICATE BUG
    # =========================
    - name: Fix MTK VCU duplicate symbol
      run: |
        FILE="drivers/media/platform/mtk-vcu/Makefile"

        if [ -f "$FILE" ]; then
          echo "Patching VCU Makefile..."
          sed -i 's/mtk_vcu_mem.o//g' $FILE || true
        fi

    # =========================
    # BUILD
    # =========================
    - name: Build kernel
      run: |
        mkdir -p $OUT_DIR

        make O=$OUT_DIR $DEFCONFIG

        make -j$(nproc) O=$OUT_DIR \
          ARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          LLVM=1 \
          LLVM_IAS=1

    # =========================
    # RESULT
    # =========================
    - name: Show output
      run: |
        ls -al $OUT_DIR/arch/arm64/boot/

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: $OUT_DIR/arch/arm64/boot/Image*
