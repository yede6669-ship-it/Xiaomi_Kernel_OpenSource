name: Build Camellia Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLANG_DIR: ${{ github.workspace }}/toolchain/clang

jobs:
  build:
    name: Build Kernel (camellia-r-oss)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            make bc bison build-essential ccache curl flex \
            git gnupg gperf wget tar \
            liblz4-tool libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush \
            rsync libglib2.0-dev schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip cpio kmod ca-certificates \
            zstd patchelf device-tree-compiler
          aarch64-linux-gnu-gcc --version | head -1
          # Verify the cross assembler is present and works
          aarch64-linux-gnu-as --version | head -1

      - name: Download Clang toolchain via AntMan
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          cd ${{ env.CLANG_DIR }}
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          bin/clang --version | head -1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: camellia-r-oss-${{ runner.os }}

      - name: Create aarch64-as wrapper
        run: |
          # Create a wrapper directory that sits on PATH BEFORE clang.
          # When clang invokes "as" with LLVM_IAS=0, it will find this
          # wrapper which delegates to aarch64-linux-gnu-as.
          mkdir -p ${{ github.workspace }}/toolchain/wrappers

          # Wrapper for bare "as" — used by scripts/mod and other host-side
          # assembly that clang drives through the cross triple.
          cat > ${{ github.workspace }}/toolchain/wrappers/aarch64-linux-gnu-as <<'EOF'
          #!/bin/bash
          exec /usr/bin/aarch64-linux-gnu-as "$@"
          EOF
          chmod +x ${{ github.workspace }}/toolchain/wrappers/aarch64-linux-gnu-as

          echo "Wrapper created:"
          ls -la ${{ github.workspace }}/toolchain/wrappers/

      - name: Patch kernel VDSO and scripts/mod Makefiles
        working-directory: kernel
        run: |
          echo "=== arch/arm64/kernel/vdso/Makefile (before patch) ==="
          cat arch/arm64/kernel/vdso/Makefile

          # The VDSO gettimeofday.S uses GNU assembler macro syntax that
          # LLVM IAS cannot handle. Disable IAS for this directory and
          # point clang at the cross assembler via -B.
          if ! grep -q "fno-integrated-as" arch/arm64/kernel/vdso/Makefile; then
            sed -i '1s|^|# Use GNU assembler for VDSO — IAS cannot parse old MTK .S syntax\n\n|' \
              arch/arm64/kernel/vdso/Makefile
            # Append to the file so it overrides any existing aflags
            cat >> arch/arm64/kernel/vdso/Makefile <<'PATCH'

# Force external GNU assembler for VDSO assembly files
KBUILD_AFLAGS_vdso := $(filter-out -integrated-as,$(KBUILD_AFLAGS))
AFLAGS_gettimeofday.o += -fno-integrated-as -B/usr/aarch64-linux-gnu/bin
PATCH
            echo "[patch] arch/arm64/kernel/vdso/Makefile done"
          fi

          # scripts/mod has the same problem — patch it too
          if ! grep -q "fno-integrated-as" scripts/mod/Makefile; then
            cat >> scripts/mod/Makefile <<'PATCH'

# Force external GNU assembler for scripts/mod
ccflags-y += -fno-integrated-as -B/usr/aarch64-linux-gnu/bin
PATCH
            echo "[patch] scripts/mod/Makefile done"
          fi

          echo "=== arch/arm64/kernel/vdso/Makefile (after patch) ==="
          cat arch/arm64/kernel/vdso/Makefile

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:${{ github.workspace }}/toolchain/wrappers:${PATH}"

          # Verify the right assembler is found
          which aarch64-linux-gnu-as
          aarch64-linux-gnu-as --version | head -1

          COMMON_FLAGS="O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            HOSTAS=/usr/bin/as \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            DTC_EXT=dtc"

          make $COMMON_FLAGS camellia_defconfig

          make $COMMON_FLAGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== Build exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERRORS AND WARNINGS ==="
            grep -n -E "error:|Error|fatal:|failed" build.log | head -150 || true
            exit $BUILD_EXIT
          fi

      - name: Check build output
        if: always()
        run: |
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "boot dir not found"
          find kernel/out -name "Image*" 2>/dev/null || echo "No Image files found"

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
