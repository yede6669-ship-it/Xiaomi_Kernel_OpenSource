name: Build Xiaomi Camellia Kernel (Legacy Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 wget tar \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Legacy Android Clang (r383902)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang-10
          cd $GITHUB_WORKSPACE/clang-10
          # 下载四年前 Android 11 内核最常用的 Clang 版本
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz
          tar -xf clang-r383902.tar.gz
          echo "$GITHUB_WORKSPACE/clang-10/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          # 1. 环境变量锁定
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_BIN=$GITHUB_WORKSPACE/clang-10/bin
          
          # 2. 准备输出
          mkdir -p out
          make O=out mrproper
          
          # 3. 加载配置
          make O=out k6833v1_64_defconfig
          
          # 4. 正式编译
          # 针对老内核，我们直接让 CROSS_COMPILE 指向系统 GCC，CC 指向老 Clang
          make -j$(nproc --all) O=out \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Legacy
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
