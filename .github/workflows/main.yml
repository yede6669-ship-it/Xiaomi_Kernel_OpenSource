name: Aghisna R20 (Downloadable Version)

on:
  workflow_dispatch:

jobs:
   build:
    runs-on: ubuntu-latest

    steps:
    - name: setting configurasi
      uses: actions/checkout@v3

    - name: setup environment
      run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python-is-python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          libghc-libyaml-dev libyaml-dev glibc-source

    - name: ready compile...
      run: |
          # 1. 下载脚本
          curl https://raw.githubusercontent.com/RooGhz720/RooGhz720/main/rx/miui-r20.sh > miui-r20.sh
          chmod +x miui-r20.sh
          
          # 2. 【核心修改：阻止删除】利用 sed 注释掉脚本中所有的 rm -rf out 和 rm -rf zip 命令
          # 这样编译完后，文件夹会被保留下来供下一步上传
          sed -i 's/rm -rf out/#rm -rf out/g' miui-r20.sh
          sed -i 's/rm -rf zip/#rm -rf zip/g' miui-r20.sh
          sed -i 's/exit/#exit/g' miui-r20.sh

          # 3. 执行脚本
          bash miui-r20.sh
      shell: bash
      env:
         CHATID: ${{ secrets.CHAT_ID }}
         API_BOT: ${{ secrets.BOT_API }}
         TYPE_KERNEL: ${{ secrets.EZA }}

    # 4. 【核心增加：GitHub 本地下载】
    # 这一步会将 zip 文件夹里的所有 .zip 包上传到 GitHub 服务器
    - name: Upload Kernel to GitHub Action
      if: always() # 确保即使 Telegram 发送失败，也会尝试上传文件
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Package
        path: |
          zip/*.zip
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image.gz
          error.log
