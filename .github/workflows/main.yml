name: Build Xiaomi Camellia Kernel (Clang 12)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 wget tar

      - name: Install Google Clang 12 (NDK r23c)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          # 下载 Google 官方编译好的 Clang 12
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b1.tar.gz
          tar -xf clang-r416183b1.tar.gz
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          # 1. 核心环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_PATH=$GITHUB_WORKSPACE/clang/bin
          export PATH=$CLANG_PATH:$PATH
          
          # 交叉编译工具链前缀
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          
          # 2. 准备输出
          mkdir -p out
          make O=out mrproper
          
          # 3. 加载配置
          echo "正在加载配置: k6833v1_64_defconfig"
          make O=out k6833v1_64_defconfig
          
          # 4. 正式开始编译
          # 使用所有 LLVM 工具以保持一致性
          make -j$(nproc --all) O=out \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Clang12
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
