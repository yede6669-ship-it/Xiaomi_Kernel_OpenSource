
name: Build Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: kernel
      OUT_DIR: out

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential flex \
          libssl-dev libelf-dev \
          clang lld llvm

    - name: Build kernel
      run: |
        cd $KERNEL_DIR

        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1

        make O=$OUT_DIR camellia_user_defconfig

        make -j$(nproc) O=$OUT_DIR

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          kernel/out/arch/arm64/boot/Image*
