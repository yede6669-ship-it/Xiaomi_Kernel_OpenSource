name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: Xiaomi_Kernel_OpenSource

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Show repository structure
      run: |
        echo "=== ROOT ==="
        pwd
        ls -al

        echo "=== KERNEL DIR ==="
        ls -al $KERNEL_DIR

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          cpio \
          flex \
          libelf-dev \
          libssl-dev \
          lld \
          llvm \
          clang \
          pahole \
          zip \
          unzip

    - name: Enter kernel source
      run: |
        cd $KERNEL_DIR

        echo "=== CURRENT DIR ==="
        pwd

        echo "=== ARM64 CONFIGS ==="
        find arch/arm64/configs -type f | sort

    - name: Fix MTK duplicate symbol issue
      run: |
        cd $KERNEL_DIR

        FILE="drivers/media/platform/mtk-vcu/Makefile"

        if [ -f "$FILE" ]; then
          echo "=== PATCHING DUPLICATE SYMBOL ISSUE ==="

          awk '!seen[$0]++' "$FILE" > temp_makefile

          mv temp_makefile "$FILE"
        fi

    - name: Detect defconfig
      run: |
        cd $KERNEL_DIR

        echo "=== SEARCHING DEFCONFIG ==="

        DEFCONFIG=$(find arch/arm64/configs -type f | grep -Ei 'camellia|k69|mt68|vendor' | head -n 1)

        echo "FOUND=$DEFCONFIG"

        if [ -z "$DEFCONFIG" ]; then
          echo "No suitable defconfig found."

          find arch/arm64/configs -type f

          exit 1
        fi

        DEFCONFIG_NAME=$(basename "$DEFCONFIG")

        echo "DEFCONFIG_NAME=$DEFCONFIG_NAME"

        echo "$DEFCONFIG_NAME" > defconfig_name.txt

    - name: Build kernel
      run: |
        cd $KERNEL_DIR

        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1

        mkdir -p out

        DEFCONFIG_NAME=$(cat defconfig_name.txt)

        echo "=== USING DEFCONFIG ==="
        echo "$DEFCONFIG_NAME"

        make O=out "$DEFCONFIG_NAME"

        make -j$(nproc) O=out

    - name: Show outputs
      run: |
        cd $KERNEL_DIR

        echo "=== OUTPUT FILES ==="

        find out/arch/arm64/boot/ -type f | sort || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: camellia-kernel-build
        path: |
          Xiaomi_Kernel_OpenSource/out/arch/arm64/boot/Image
          Xiaomi_Kernel_OpenSource/out/arch/arm64/boot/Image.gz
          Xiaomi_Kernel_OpenSource/out/arch/arm64/boot/Image.gz-dtb
