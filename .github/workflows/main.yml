name: Build Xiaomi Camellia Kernel (Debian Mode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 切换到 Debian 11，这是四年前最稳的环境
    container:
      image: debian:bullseye

    steps:
      - name: Install Base Dependencies
        run: |
          apt-get update
          apt-get install -y bc bison flex gperf build-essential git libelf-dev libssl-dev python3 wget tar \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup Legacy Clang (r353983c)
        run: |
          mkdir -p /build/clang
          cd /build/clang
          # 下载兼容性最好的旧版 Android Clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r353983c.tar.gz
          tar -xf clang-r353983c.tar.gz

      - name: Build Kernel
        run: |
          # 1. 设置环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=/build/clang/bin:$PATH
          
          # 2. 准备输出
          mkdir -p out
          make O=out mrproper
          
          # 3. 加载配置
          make O=out k6833v1_64_defconfig
          
          # 4. 强制修复：如果源码 Makefile 里的参数太激进，这里做一下兼容处理
          # 这一步是为了防止之前出现的 "unknown argument" 错误
          sed -i 's/-fstack-protector-strong//g' Makefile || true
          
          # 5. 编译
          make -j$(nproc --all) O=out \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Debian
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
