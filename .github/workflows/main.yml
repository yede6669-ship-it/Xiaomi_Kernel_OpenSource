name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: 检出仓库
      uses: actions/checkout@v4

    - name: 清理磁盘空间
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
        sudo apt-get clean && sudo apt-get autoremove -y
        df -h

    - name: 安装GCC-9和依赖
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          gcc-9 g++-9 \
          gcc-9-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          bc bison build-essential curl flex git libssl-dev \
          wget python3 device-tree-compiler libncurses5-dev make

        # 设置gcc-9为默认
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-9 90
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-9 90

        # 创建aarch64交叉编译器符号链接，让CROSS_COMPILE前缀能找到gcc-9
        sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/local/bin/aarch64-linux-gnu-gcc

        echo "===== 验证编译器版本 ====="
        gcc --version
        aarch64-linux-gnu-gcc --version

    - name: 下载内核源码
      run: |
        cd $HOME
        wget -q --show-progress \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource/archive/refs/heads/camellia-r-oss.zip \
          -O kernel.zip
        unzip -q kernel.zip
        mv Xiaomi_Kernel_OpenSource-camellia-r-oss kernel
        rm kernel.zip
        echo "源码下载完成，大小："
        du -sh $HOME/kernel

    - name: 配置内核
      run: |
        cd $HOME/kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc-9
        export HOSTCXX=g++-9

        make camellia_defconfig
        make olddefconfig

    - name: 编译内核
      run: |
        cd $HOME/kernel

        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=aarch64-linux-gnu-gcc
        export HOSTCC=gcc-9
        export HOSTCXX=g++-9
        export KCFLAGS="-w"
        export KAFLAGS="-w"

        echo "===== 开始编译 ====="
        make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log || {
          echo "===== Image.gz-dtb失败，尝试只编译Image ====="
          make -j$(nproc) Image 2>&1 | tee -a build.log || true

          if [ -f "arch/arm64/boot/Image" ]; then
            echo "压缩Image..."
            gzip -c arch/arm64/boot/Image > arch/arm64/boot/Image.gz

            make -j$(nproc) dtbs 2>&1 | tail -50 || true
            DTB=$(find arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | head -1)
            if [ -n "$DTB" ]; then
              echo "合并DTB: $DTB"
              cat arch/arm64/boot/Image.gz "$DTB" > arch/arm64/boot/Image.gz-dtb
            else
              cp arch/arm64/boot/Image.gz arch/arm64/boot/Image.gz-dtb
            fi
          fi
        }

        echo "===== 检查编译结果 ====="
        if [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
          echo "✅ 成功生成 Image.gz-dtb"
          ls -lh arch/arm64/boot/Image.gz-dtb
        elif [ -f "arch/arm64/boot/Image" ]; then
          echo "⚠️ 只有Image"
          ls -lh arch/arm64/boot/Image
        else
          echo "❌ 编译失败，显示最后100行日志："
          tail -100 build.log
          exit 1
        fi

    - name: 打包产物
      run: |
        mkdir -p $HOME/output

        for f in Image.gz-dtb Image.gz Image; do
          if [ -f "$HOME/kernel/arch/arm64/boot/$f" ]; then
            cp "$HOME/kernel/arch/arm64/boot/$f" $HOME/output/
            echo "已打包: $f"
            break
          fi
        done

      
