name: Build Xiaomi Camellia Kernel (Stable Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # =========================
    # 1. 拉源码（固定分支）
    # =========================
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: camellia-r-oss
        fetch-depth: 1

    # =========================
    # 2. 基础依赖
    # =========================
    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          cpio \
          flex \
          git \
          libelf-dev \
          libssl-dev \
          lld \
          llvm \
          clang \
          wget \
          zip \
          unzip \
          pahole

    # =========================
    # 3. Clang 工具链（稳定版）
    # =========================
    - name: Setup Clang toolchain
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang

        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master.tar.gz -O clang.tar.gz

        tar -xf clang.tar.gz

        echo "$HOME/clang/bin" >> $GITHUB_PATH

    # =========================
    # 4. 检查源码
    # =========================
    - name: Verify kernel tree
      run: |
        echo "=== ROOT ==="
        ls -al

        echo "=== CONFIGS ==="
        find arch/arm64/configs -type f

    # =========================
    # 5. 自动选择 defconfig
    # =========================
    - name: Detect defconfig
      run: |
        DEFCONFIG=$(find arch/arm64/configs -type f | grep -Ei \
        'camellia|k69|mt68|gki|vendor' | head -n 1)

        if [ -z "$DEFCONFIG" ]; then
          echo "❌ No defconfig found"
          exit 1
        fi

        echo "FOUND=$DEFCONFIG"

        basename "$DEFCONFIG" > defconfig.txt

        echo "USING=$(cat defconfig.txt)"

    # =========================
    # 6. 修 MTK VCU（避免 duplicate symbol）
    # =========================
    - name: Fix MTK VCU build issue
      run: |
        FILE="drivers/media/platform/mtk-vcu/Makefile"

        if [ -f "$FILE" ]; then
          awk '!seen[$0]++' "$FILE" > tmp
          mv tmp "$FILE"
        fi

    # =========================
    # 7. 编译 kernel（核心修复点）
    # =========================
    - name: Build kernel (Clang)
      run: |
        export ARCH=arm64
        export SUBARCH=arm64

        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump

        export LLVM=1
        export LLVM_IAS=1

        mkdir -p out

        DEFCONFIG=$(cat defconfig.txt)

        echo "=== BUILD DEFCONFIG ==="
        echo "$DEFCONFIG"

        make O=out "$DEFCONFIG"

        make -j$(nproc) O=out \
          CC=clang \
          LD=ld.lld

    # =========================
    # 8. 输出检查
    # =========================
    - name: Show build output
      run: |
        echo "=== OUTPUT ==="
        find out/arch/arm64/boot -type f || true

    # =========================
    # 9. 上传产物
    # =========================
    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: camellia-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
