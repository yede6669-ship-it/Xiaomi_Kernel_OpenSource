name: Build Xiaomi Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KERNEL_DEFCONFIG: camellia_defconfig   # 改成你的机型对应的 defconfig

    steps:
    - name: Checkout source
      uses: actions/checkout@v3
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl unzip bc build-essential flex bison libssl-dev libncurses5-dev

    - name: Download mkbootimg tools
      run: |
        mkdir -p tools
        curl -L -o tools/mkbootimg_tools.zip https://github.com/osm0sis/mkbootimg_tools/archive/refs/heads/master.zip
        unzip tools/mkbootimg_tools.zip -d tools
        mv tools/mkbootimg_tools-master/* tools/
        chmod +x tools/*.sh

    - name: Setup kernel defconfig
      run: |
        make O=out $KERNEL_DEFCONFIG

    - name: Build Kernel
      run: |
        # 屏蔽 warnings 导致的编译失败
        make -j$(nproc) O=out KCFLAGS="-Wno-error" 2>&1 | tee build.log

    - name: Check boot image
      run: |
        echo ">>> boot dir:"
        ls -al out/arch/arm64/boot/

    - name: Pack boot.img
      run: |
        # 下载示例 boot.img (你自己的机型换成真实 boot.img)
        curl -L -o boot.img https://example.com/your_boot.img
        # 使用 mkbootimg 工具重新打包
        tools/unpackbootimg.sh boot.img -o out/
        tools/mkbootimg.sh --kernel out/arch/arm64/boot/Image \
          --ramdisk out/ramdisk.gz \
          --cmdline "console=ttyS0,115200n8" \
          --output out/boot-new.img

    - name: Upload boot.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: boot-new.img
        path: out/boot-new.img

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
