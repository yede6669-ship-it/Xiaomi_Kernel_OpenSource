name: Build Camellia Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLANG_DIR: ${{ github.workspace }}/toolchain/clang

jobs:
  build:
    name: Build Kernel (camellia-r-oss)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          path: scripts_repo

      - name: Cache kernel source tree
        id: cache-kernel-src
        uses: actions/cache@v4
        with:
          path: kernel
          key: kernel-src-camellia-r-oss-v1

      - name: Checkout kernel source
        if: steps.cache-kernel-src.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            make bc bison build-essential ccache curl flex \
            git gnupg gperf wget tar \
            liblz4-tool libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush \
            rsync libglib2.0-dev schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip cpio kmod ca-certificates \
            zstd patchelf device-tree-compiler
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-as --version | head -1

      - name: Cache Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-neutron-${{ runner.os }}-v1

      - name: Download Clang toolchain via AntMan
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          cd ${{ env.CLANG_DIR }}
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          chmod +x bin/*
          bin/clang --version | head -1

      - name: Verify Clang toolchain
        run: |
          chmod +x ${{ env.CLANG_DIR }}/bin/*
          ${{ env.CLANG_DIR }}/bin/clang --version | head -1

      - name: Fix missing cfi_ignorelist.txt
        run: |
          CLANG_VER=$(${{ env.CLANG_DIR }}/bin/clang --version | grep -oP '\d+\.\d+\.\d+' | head -1)
          CLANG_MAJOR=$(echo "$CLANG_VER" | cut -d. -f1)
          echo "Clang 版本: $CLANG_VER  主版本号: $CLANG_MAJOR"
          mkdir -p "${{ env.CLANG_DIR }}/lib/clang/${CLANG_MAJOR}/share"
          touch "${{ env.CLANG_DIR }}/lib/clang/${CLANG_MAJOR}/share/cfi_ignorelist.txt"
          mkdir -p "${{ env.CLANG_DIR }}/lib/clang/${CLANG_VER}/share"
          touch "${{ env.CLANG_DIR }}/lib/clang/${CLANG_VER}/share/cfi_ignorelist.txt"
          echo ">>> 验证"
          ls "${{ env.CLANG_DIR }}/lib/clang/${CLANG_MAJOR}/share/"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: camellia-r-oss-${{ runner.os }}

      - name: Install assembler wrapper
        run: |
          bash ${{ github.workspace }}/scripts_repo/.github/workflows/make_as_wrapper.sh \
            ${{ env.CLANG_DIR }}/bin
          echo "PATH check:"
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"
          which as
          as --version | head -1

      - name: Patch kernel source
        working-directory: kernel
        run: |
          echo ">>> [1] patch_kernel.py"
          python3 ${{ github.workspace }}/scripts_repo/.github/workflows/patch_kernel.py
          echo ">>> [2] patch_stackprotector.py"
          python3 ${{ github.workspace }}/scripts_repo/.github/workflows/patch_stackprotector.py

      - name: Generate defconfig and fix .config
        working-directory: kernel
        timeout-minutes: 10
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"
          COMMON_FLAGS="O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            HOSTAS=/usr/bin/as \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            DTC_EXT=dtc \
            KCONFIG_NOTIMESTAMP=1"
          echo ">>> 确认 as 指向包装器"
          which as && as --version | head -1
          echo ">>> 先单独编译 kconfig 工具"
          make $COMMON_FLAGS scripts/kconfig/conf 2>&1 &
          KCONFIG_PID=$!
          sleep 30
          if kill -0 $KCONFIG_PID 2>/dev/null; then
            echo "!!! kconfig 编译 30 秒后仍未完成，打印进程树 !!!"
            ps auxf || true
            kill $KCONFIG_PID || true
            exit 1
          fi
          wait $KCONFIG_PID
          echo ">>> kconfig 编译完成"
          echo ">>> 生成 defconfig"
          make $COMMON_FLAGS camellia_defconfig < /dev/null 2>&1
          echo ">>> defconfig 完成"
          echo ">>> 修改 .config"
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' out/.config
          sed -i '/^CONFIG_CC_STACKPROTECTOR_NONE/d' out/.config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          sed -i 's/CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/' out/.config
          sed -i 's/CONFIG_CFI_PERMISSIVE=y/# CONFIG_CFI_PERMISSIVE is not set/' out/.config
          echo "# CONFIG_CFI_CLANG is not set" >> out/.config
          echo "# CONFIG_CFI_PERMISSIVE is not set" >> out/.config
          echo ">>> olddefconfig"
          make $COMMON_FLAGS olddefconfig < /dev/null
          echo ">>> 验证关键配置"
          grep -E "STACKPROTECTOR|CFI" out/.config || true

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"
          echo ">>> 确认 as 指向包装器"
          which as && as --version | head -1
          COMMON_FLAGS="O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            HOSTAS=/usr/bin/as \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            DTC_EXT=dtc"
          make $COMMON_FLAGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "=== Build exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERRORS ==="
            grep -n " error:" build.log | head -100 || true
            exit $BUILD_EXIT
          fi

      - name: Check build output
        if: always()
        run: |
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "boot dir not found"
          find kernel/out -name "Image*" 2>/dev/null || echo "No Image files found"

      # ──────────────────────────────────────────────
      # AnyKernel3 打包
      # ──────────────────────────────────────────────
      - name: Clone AnyKernel3
        if: success()
        run: |
          # 如果你有自己定制好的 AnyKernel3 仓库，把下面地址换掉
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Configure AnyKernel3 for camellia
        if: success()
        run: |
          cd AnyKernel3
          # 基本信息
          sed -i 's/kernel.string=.*/kernel.string=Camellia Kernel by GitHub Actions #${{ github.run_number }}/' anykernel.sh
          # 设备校验：只允许 camellia 刷入；如不需要校验设备直接改成 0
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          sed -i 's/device.name1=.*/device.name1=camellia/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=/' anykernel.sh
          # 分区路径（camellia 标准路径）
          sed -i 's|block=/dev/.*|block=/dev/block/platform/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's/is.slot.device=.*/is.slot.device=0/' anykernel.sh
          sed -i 's/ramdisk.compression=.*/ramdisk.compression=auto/' anykernel.sh

      - name: Copy kernel image into AnyKernel3
        if: success()
        run: |
          # 按优先级复制，只取第一个存在的镜像
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
            echo "Copied Image.gz-dtb"
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
            echo "Copied Image.gz"
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
            echo "Copied Image"
          else
            echo "ERROR: 没有找到任何内核镜像！"
            exit 1
          fi
          # dtbo（可选，如不需要注释掉）
          if [ -f kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
            echo "Copied dtbo.img"
          fi

      - name: Package AnyKernel3 zip
        if: success()
        run: |
          ZIP_NAME="Camellia-Kernel-${{ github.run_number }}-$(date -u +%Y%m%d).zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . \
            -x "*.git*" \
            -x "README.md" \
            -x "*.placeholder" \
            -x "LICENSE"
          echo ">>> 打包完成: ${ZIP_NAME}"
          ls -lh "../${ZIP_NAME}"

      - name: Upload AnyKernel3 zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-AnyKernel3-${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      # ──────────────────────────────────────────────
      # 原始镜像（备用）
      # ──────────────────────────────────────────────
      - name: Upload kernel image (raw)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-image-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
