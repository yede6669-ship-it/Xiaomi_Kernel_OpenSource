name: Build Camellia Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 不用24.04，22.04对旧内核更兼容

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make bc bison build-essential curl flex \
            git libssl-dev libelf-dev \
            python3 python3-pip cpio kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            liblz4-tool xz-utils zlib1g-dev libncurses5-dev
          aarch64-linux-gnu-gcc --version | head -1

      # 使用 Neutron Clang 18，专为 Android 旧内核设计，兼容性好
      - name: Download Neutron Clang 18
        run: |
          mkdir -p clang
          cd clang
          # Neutron Clang 专为 Android 内核优化，不会有 GLIBC 问题（ubuntu-22.04自带2.35+）
          curl -LO "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/11012023/neutron-clang-11012023.tar.zst"
          tar --use-compress-program=unzstd -xf neutron-clang-11012023.tar.zst
          rm neutron-clang-11012023.tar.zst
          bin/clang --version | head -1

      - name: Build kernel
        working-directory: kernel
        run: |
          export CLANG_PATH="${{ github.workspace }}/clang/bin"
          export PATH="$CLANG_PATH:$PATH"

          # 禁用所有 warning as error，避免新编译器对旧代码的误判
          export KCFLAGS="-w"
          export KCPPFLAGS="-w"

          ARGS="O=out
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            LLVM_IAS=0"

          # 生成配置
          make $ARGS camellia_defconfig

          # 修复 CONFIG_CC_STACKPROTECTOR 检测误判
          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable  CONFIG_CC_STACKPROTECTOR_NONE

          # 重新同步配置
          make $ARGS olddefconfig

          # 编译
          make $ARGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERRORS ==="
            grep "error:" build.log | grep -v "^#" | head -80
            echo "=== LAST 200 LINES ==="
            tail -200 build.log
            exit $BUILD_EXIT
          fi

      - name: Check output
        if: always()
        run: |
          echo "=== Disk usage ==="
          df -h
          echo "=== Boot files ==="
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "not found"

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
