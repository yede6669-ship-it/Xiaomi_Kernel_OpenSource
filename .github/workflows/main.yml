# A simple action usage
name: Build Kernel
on:
  workflow_dispatch:

jobs:
  Build-Kernel:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
          kernel-dir: msm-4.14
          kernel-branch: camellia-r-oss
          config: k6833v1_64_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
         
          android-version: 11
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
       # 满足 Makefile 对 Clang 三元组的所有可能检查
          extra-make-args: |
            CLANG_TRIPLE=aarch64-linux-gnu- 
            CROSS_COMPILE=aarch64-linux-android- 
            HOSTCC=gcc 
            HOSTCXX=g++
