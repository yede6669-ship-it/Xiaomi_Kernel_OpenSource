name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 clang lld llvm

      - name: Build Kernel
        run: |
          # 1. 查找包含 Makefile 的内核根目录
          # 直接寻找包含关键配置目录的 Makefile 所在位置
          SRC_DIR=$(find . -maxdepth 3 -name "Makefile" | xargs grep -l "arch/arm64/configs" | head -n 1 | xargs dirname)
          
          if [ -z "$SRC_DIR" ]; then
            if [ -f "./Makefile" ]; then
                SRC_DIR="."
            else
                echo "错误：找不到内核主源码目录！请检查分支内容。"
                ls -R
                exit 1
            fi
          fi
          
          cd "$SRC_DIR"
          echo "当前工作目录: $(pwd)"

          # 2. 设置环境变量 (针对小米 MTK 平台)
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 3. 准备输出目录并清理
          mkdir -p out
          make O=out mrproper
          
          # 4. 使用你指定的配置文件
          echo "正在加载配置: k6833v1_64_defconfig"
          make O=out k6833v1_64_defconfig
          
          # 5. 正式编译 (使用所有 CPU 核心)
          make -j$(nproc --all) O=out \
              CC=$CC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Output
          path: "**/out/arch/arm64/boot/Image*"
