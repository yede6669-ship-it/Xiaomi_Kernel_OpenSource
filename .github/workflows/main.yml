name: Build Camellia Kernel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            make bc bison build-essential curl flex git \
            libssl-dev libelf-dev python3 cpio kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            liblz4-tool xz-utils zlib1g-dev libncurses5-dev
          aarch64-linux-gnu-gcc --version | head -1

      # 直接 clone AOSP Clang r416183b 的 GitHub 镜像
      # 这是 Android 11 时代官方工具链，GLIBC 需求极低
      - name: Download AOSP Clang r416183b
        run: |
          echo "Cloning AOSP Clang r416183b from GitHub mirror..."
          git clone --depth=1 --single-branch \
            --branch clang-r416183b \
            https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b \
            ${{ github.workspace }}/clang
          echo "=== Clang version ==="
          ${{ github.workspace }}/clang/bin/clang --version | head -1

      - name: Build kernel
        working-directory: kernel
        run: |
          export CLANG_PATH="${{ github.workspace }}/clang/bin"
          export PATH="$CLANG_PATH:$PATH"

          export KCFLAGS="-w"
          export KCPPFLAGS="-w"

          ARGS="O=out
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            LLVM_IAS=0"

          echo "=== Tool check ==="
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

          echo "=== Generating defconfig ==="
          make $ARGS camellia_defconfig

          echo "=== Fixing stackprotector ==="
          scripts/config --file out/.config \
            --disable CONFIG_CC_STACKPROTECTOR_STRONG \
            --enable  CONFIG_CC_STACKPROTECTOR_NONE
          make $ARGS olddefconfig

          echo "=== Building ==="
          make $ARGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== Exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ERRORS ==="
            grep "error:" build.log | grep -v "^#" | head -80 || true
            echo "=== LAST 200 LINES ==="
            tail -200 build.log
            exit $BUILD_EXIT
          fi

      - name: Check output
        if: always()
        run: |
          df -h
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "boot dir not found"
          find kernel/out -name "Image*" 2>/dev/null || true

      - name: Upload kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
