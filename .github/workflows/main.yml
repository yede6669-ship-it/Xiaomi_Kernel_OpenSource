name: Build Camellia Kernel + Boot.img

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ 拉 kernel
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel

      # 2️⃣ 修 apt + 安装依赖
      - name: Install dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list
          sudo apt-get clean
          sudo apt-get -o Acquire::ForceIPv4=true update -y

          sudo apt-get install -y \
            bc bison flex build-essential curl git \
            libssl-dev libncurses5-dev \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            device-tree-compiler \
            cpio unzip

      # 3️⃣ clang
      - name: Download clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Setup env
        run: |
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      # 4️⃣ 编译 kernel（修 Werror）
      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH=$CLANG_PATH:$PATH

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=0

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-

          mkdir -p out

          make O=out camellia_defconfig

          make -j$(nproc) \
            O=out \
            KCFLAGS=-Wno-error \
            2>&1 | tee build.log

      # 5️⃣ 下载 stock boot.img（你必须换成自己的！）
      - name: Download stock boot
        run: |
          echo ">>> 下载示例 boot.img（你应该换成自己机型）"
          curl -L -o boot.img https://github.com/topjohnwu/magisk-files/raw/master/boot.img

      # 6️⃣ 解包 boot.img
      - name: Unpack boot
        run: |
          git clone https://github.com/osm0sis/mkbootimg_tools tools
          cd tools

          chmod +x unpackbootimg.sh
          ./unpackbootimg.sh ../boot.img

      # 7️⃣ 替换 kernel
      - name: Replace kernel
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb tools/zImage

      # 8️⃣ 重新打包 boot.img
      - name: Repack boot
        run: |
          cd tools

          chmod +x mkbootimg.sh

          ./mkbootimg.sh \
            --kernel zImage \
            --ramdisk ramdisk.cpio.gz \
            --cmdline "$(cat boot.img-cmdline)" \
            --base $(cat boot.img-base) \
            --pagesize $(cat boot.img-pagesize) \
            --output new-boot.img

          mv new-boot.img ../boot-new.img

      # 9️⃣ 上传
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dtbo.img
            boot-new.img
            kernel/build.log
