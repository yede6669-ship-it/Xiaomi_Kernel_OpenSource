name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          cpio \
          flex \
          libelf-dev \
          libssl-dev \
          clang \
          llvm \
          lld \
          pahole \
          zip \
          unzip

    - name: Locate kernel source
      run: |
        echo "=== SEARCHING KERNEL SOURCE ==="

        find . -name Makefile | head -20

        if [ -f "./Makefile" ] && [ -d "./arch" ]; then
          KERNEL_DIR="."
        elif [ -f "./kernel/Makefile" ]; then
          KERNEL_DIR="./kernel"
        elif [ -f "./Xiaomi_Kernel_OpenSource/Makefile" ]; then
          KERNEL_DIR="./Xiaomi_Kernel_OpenSource"
        else
          echo "Kernel source not found!"
          exit 1
        fi

        echo "KERNEL_DIR=$KERNEL_DIR"

        echo "$KERNEL_DIR" > kernel_dir.txt

    - name: Show kernel tree
      run: |
        KERNEL_DIR=$(cat kernel_dir.txt)

        cd $KERNEL_DIR

        echo "=== CURRENT DIR ==="
        pwd

        echo "=== ROOT FILES ==="
        ls -al

        echo "=== CONFIGS ==="
        find arch/arm64/configs -type f | head -50

    - name: Fix duplicate symbol issue
      run: |
        KERNEL_DIR=$(cat kernel_dir.txt)

        cd $KERNEL_DIR

        FILE="drivers/media/platform/mtk-vcu/Makefile"

        if [ -f "$FILE" ]; then
          echo "=== PATCHING MTK DUPLICATES ==="

          awk '!seen[$0]++' "$FILE" > temp_makefile

          mv temp_makefile "$FILE"
        fi

    - name: Detect defconfig
      run: |
        KERNEL_DIR=$(cat kernel_dir.txt)

        cd $KERNEL_DIR

        echo "=== DETECTING DEFCONFIG ==="

        DEFCONFIG=$(find arch/arm64/configs -type f | grep -Ei \
        'camellia|k69|mt68|vendor|gki' | head -n 1)

        echo "FOUND=$DEFCONFIG"

        if [ -z "$DEFCONFIG" ]; then
          echo "No defconfig found!"
          exit 1
        fi

        basename "$DEFCONFIG" > defconfig_name.txt

        echo "DEFCONFIG=$(cat defconfig_name.txt)"

    - name: Build kernel
      run: |
        KERNEL_DIR=$(cat kernel_dir.txt)

        cd $KERNEL_DIR

        export ARCH=arm64
        export SUBARCH=arm64
        export LLVM=1
        export LLVM_IAS=1

        mkdir -p out

        DEFCONFIG=$(cat defconfig_name.txt)

        echo "=== BUILDING WITH ==="
        echo "$DEFCONFIG"

        make O=out "$DEFCONFIG"

        make -j$(nproc) O=out

    - name: Show output
      run: |
        KERNEL_DIR=$(cat kernel_dir.txt)

        cd $KERNEL_DIR

        echo "=== BUILD OUTPUT ==="

        find out/arch/arm64/boot/ -type f | sort || true

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: camellia-kernel
        path: |
          **/out/arch/arm64/boot/Image
          **/out/arch/arm64/boot/Image.gz
          **/out/arch/arm64/boot/Image.gz-dtb
