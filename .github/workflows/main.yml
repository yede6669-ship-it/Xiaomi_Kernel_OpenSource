name: Build Camellia Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLANG_DIR: /home/runner/work/Xiaomi_Kernel_OpenSource/Xiaomi_Kernel_OpenSource/toolchain/clang

jobs:
  build:
    name: Build Kernel (camellia-r-oss)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf
          sudo apt-get install -y --no-install-recommends \
            make bc bison build-essential ccache curl flex \
            git gnupg gperf \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip cpio kmod
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download Clang toolchain
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          wget --progress=dot:giga \
            https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz \
            -O clang.tar.gz
          tar -xzf clang.tar.gz -C ${{ env.CLANG_DIR }}
          rm clang.tar.gz
          ${{ env.CLANG_DIR }}/bin/clang --version | head -1

      - name: Patch Clang assembler
        run: |
          CLANG_BIN=${{ env.CLANG_DIR }}/bin

          # 备份原始 LLVM as
          mv $CLANG_BIN/as $CLANG_BIN/as.real

          # wrapper: -EL/-EB 说明是 ARM，走 clang integrated-as
          # --64 等 x86 选项说明是 host，走系统真实的 as
          printf '%s\n' \
            '#!/bin/bash' \
            'IS_ARM=0' \
            'NEWARGS=()' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    -EL|-EB) IS_ARM=1 ;;' \
            '    --target=aarch64*) IS_ARM=1 ; NEWARGS+=("$arg") ;;' \
            '    --target=arm*) IS_ARM=1 ; NEWARGS+=("$arg") ;;' \
            '    *) NEWARGS+=("$arg") ;;' \
            '  esac' \
            'done' \
            'if [ "$IS_ARM" = "1" ]; then' \
            '  exec "$(dirname "$0")/clang" --target=aarch64-linux-gnu -integrated-as -c "${NEWARGS[@]}"' \
            'else' \
            '  exec /usr/bin/as "$@"' \
            'fi' \
            > $CLANG_BIN/as

          # aarch64 交叉编译前缀版本
          printf '%s\n' \
            '#!/bin/bash' \
            'NEWARGS=()' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    -EL|-EB) ;;' \
            '    *) NEWARGS+=("$arg") ;;' \
            '  esac' \
            'done' \
            'exec "$(dirname "$0")/clang" --target=aarch64-linux-gnu -integrated-as -c "${NEWARGS[@]}"' \
            > $CLANG_BIN/aarch64-linux-gnu-as

          # arm32 交叉编译前缀版本
          printf '%s\n' \
            '#!/bin/bash' \
            'NEWARGS=()' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    -EL|-EB) ;;' \
            '    *) NEWARGS+=("$arg") ;;' \
            '  esac' \
            'done' \
            'exec "$(dirname "$0")/clang" --target=arm-linux-gnueabihf -integrated-as -c "${NEWARGS[@]}"' \
            > $CLANG_BIN/arm-linux-gnueabihf-as

          chmod +x $CLANG_BIN/as
          chmod +x $CLANG_BIN/aarch64-linux-gnu-as
          chmod +x $CLANG_BIN/arm-linux-gnueabihf-as
          echo "=== Done patching ==="
          ls -la $CLANG_BIN/as $CLANG_BIN/as.real

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: camellia-r-oss-${{ runner.os }}

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"

          clang --version | head -1

          COMMON_FLAGS="O=out
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            STRIP=llvm-strip
            LLVM_IAS=1
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-"

          make $COMMON_FLAGS camellia_defconfig

          make $COMMON_FLAGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== Build exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== ALL ERRORS ==="
            grep -n "error:" build.log | head -50 || true
            echo "=== LAST 300 LINES ==="
            tail -300 build.log
            exit $BUILD_EXIT
          fi

      - name: Check build output
        if: always()
        run: |
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "boot dir not found"
          find kernel/out -name "Image*" 2>/dev/null || echo "No Image files found"

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
