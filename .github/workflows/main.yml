name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1
          # 确保源码直接放在根目录，而不是子文件夹

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 clang lld llvm

      - name: Build Kernel
        # 如果你的 Makefile 在子目录（比如 KKEE），请把下面这行改为 ./KKEE
        working-directory: . 
        run: |
          # 1. 准备输出目录
          mkdir -p out
          
          # 2. 定义环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 3. 检查 Makefile 是否存在（防止路径错误）
          if [ ! -f Makefile ]; then
            echo "错误：当前目录 $(pwd) 下找不到 Makefile！"
            ls -al
            exit 1
          fi

          # 4. 开始构建 (跳过 clean，直接 mrproper 更彻底)
          make O=out mrproper
          
          # 5. 配置 (确认这个文件名在你 arch/arm64/configs/ 下)
          make O=out k6833v1_64_defconfig
          
          # 6. 编译
          make -j$(nproc --all) O=out \
              CC=$CC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: out/arch/arm64/boot/Image*
