name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: camellia-r-oss
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          build-essential \
          cpio \
          flex \
          libelf-dev \
          libssl-dev \
          pahole \
          zip \
          unzip \
          git

    - name: Setup GCC Toolchains
      run: |
        mkdir -p $HOME/toolchains
        cd $HOME/toolchains

        git clone --depth=1 https://github.com/mvaisakh/gcc-arm64 gcc64
        git clone --depth=1 https://github.com/mvaisakh/gcc-arm gcc32

        echo "$HOME/toolchains/gcc64/bin" >> $GITHUB_PATH
        echo "$HOME/toolchains/gcc32/bin" >> $GITHUB_PATH

    - name: Verify source tree
      run: |
        echo "=== ROOT ==="
        ls -al

        echo "=== DEFCONFIGS ==="
        find arch/arm64/configs -type f | head -30

    - name: Fix MTK duplicate issue
      run: |
        FILE="drivers/media/platform/mtk-vcu/Makefile"

        if [ -f "$FILE" ]; then
          echo "=== PATCHING DUPLICATES ==="

          awk '!seen[$0]++' "$FILE" > temp_makefile
          mv temp_makefile "$FILE"
        fi

    - name: Detect defconfig
      run: |
        DEFCONFIG=$(find arch/arm64/configs -type f | grep -Ei \
        'camellia|k69|mt68' | head -n 1)

        echo "FOUND=$DEFCONFIG"

        if [ -z "$DEFCONFIG" ]; then
          echo "No defconfig found!"
          exit 1
        fi

        basename "$DEFCONFIG" > defconfig.txt

        echo "USING=$(cat defconfig.txt)"

    - name: Build kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64

        export CROSS_COMPILE=aarch64-elf-
        export CROSS_COMPILE_ARM32=arm-eabi-

        mkdir -p out

        DEFCONFIG=$(cat defconfig.txt)

        echo "=== BUILDING ==="
        echo "$DEFCONFIG"

        make O=out "$DEFCONFIG"

        make -j$(nproc) O=out

    - name: Show outputs
      run: |
        echo "=== OUTPUT FILES ==="

        find out/arch/arm64/boot/ -type f | sort || true

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: camellia-kernel
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image.gz-dtb
