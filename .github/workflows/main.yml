name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 clang lld llvm

      - name: Build Kernel
        run: |
          # 1. 准确定位内核根目录
          SRC_DIR=$(find . -maxdepth 3 -name "Makefile" -exec test -e "{}/../arch" \; -print -quit | xargs dirname)
          [ -z "$SRC_DIR" ] && SRC_DIR="."
          cd "$SRC_DIR"
          
          # 2. 自动寻找正确的 defconfig 文件
          # 优先找 camellia，其次找 k6833
          CONF_FILE=$(ls arch/arm64/configs/ | grep -Ei "camellia|k6833" | head -n 1)
          
          if [ -z "$CONF_FILE" ]; then
            echo "错误：在 arch/arm64/configs/ 下找不到包含 camellia 或 k6833 的配置文件！"
            echo "当前可选的配置文件有："
            ls arch/arm64/configs/
            exit 1
          fi
          echo "检测到配置文件: $CONF_FILE"

          # 3. 设置环境变量
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 4. 准备输出目录
          mkdir -p out
          
          # 5. 彻底清理
          make O=out mrproper
          
          # 6. 使用探测到的配置文件进行配置
          make O=out "$CONF_FILE"
          
          # 7. 编译
          make -j$(nproc --all) O=out \
              CC=$CC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Output
          path: "**/out/arch/arm64/boot/Image*"
