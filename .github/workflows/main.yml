name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          # 安装 GCC 交叉编译器，这是 Clang 的重要辅助
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 wget tar \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld llvm

      - name: Setup Clang 12
        run: |
          # 使用 Ubuntu 自带的 Clang 12，这比手动下载更稳定且路径自动配置
          sudo apt-get install -y clang-12 lld-12
          # 创建软链接，确保系统调用 clang 时用的是 12 版本
          sudo ln -sf /usr/bin/clang-12 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-12 /usr/bin/ld.lld

      - name: Build Kernel
        run: |
          # 1. 核心环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 明确交叉编译器前缀
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 2. 准备输出
          mkdir -p out
          make O=out mrproper
          
          # 3. 加载配置
          echo "正在加载配置: k6833v1_64_defconfig"
          make O=out k6833v1_64_defconfig
          
          # 4. 正式开始编译
          # 关键：手动指定 CC=clang，且确保用的是 clang-12
          make -j$(nproc --all) O=out \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-Result
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
