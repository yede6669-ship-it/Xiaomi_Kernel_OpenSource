name: Build Camellia Kernel (FIXED)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: .
      OUT_DIR: out
      ARCH: arm64
      SUBARCH: arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev libelf-dev \
          build-essential git wget curl python3

    # =========================
    # FIXED CLANG TOOLCHAIN
    # =========================
    - name: Setup Clang (Google 18 stable)
      run: |
        mkdir -p $HOME/clang
        cd $HOME/clang

        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master.tar.gz -O clang.tar.gz

        tar -xf clang.tar.gz

        echo "$HOME/clang/bin" >> $GITHUB_PATH
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "LD=ld.lld" >> $GITHUB_ENV
        echo "AR=llvm-ar" >> $GITHUB_ENV
        echo "NM=llvm-nm" >> $GITHUB_ENV
        echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
        echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV

    - name: Detect defconfig
      run: |
        echo "=== FIND DEFCONFIG ==="
        DEFCONFIG=$(find arch/arm64/configs -name "*camellia*defconfig" | head -n 1)

        if [ -z "$DEFCONFIG" ]; then
          DEFCONFIG=$(find arch/arm64/configs -name "defconfig" | head -n 1)
        fi

        echo "USING=$DEFCONFIG"
        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

    # =========================
    # FIX VCU DUPLICATE SYMBOL
    # =========================
    - name: Fix MediaTek VCU build
      run: |
        echo "Fix duplicate symbols..."

        FILE="drivers/media/platform/mtk-vcu/Makefile"
        if [ -f "$FILE" ]; then
          sed -i 's/mtk_vcu_mem.o//g' $FILE || true
        fi

    # =========================
    # BUILD
    # =========================
    - name: Build kernel
      run: |
        export PATH=$HOME/clang/bin:$PATH

        make O=$OUT_DIR $DEFCONFIG

        # 🔥 强制 LLVM + 禁 GCC
        make -j$(nproc) O=$OUT_DIR \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          ARCH=arm64

    - name: Package
      run: |
        ls -al $OUT_DIR/arch/arm64/boot/

    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: boot-image
        path: $OUT_DIR/arch/arm64/boot/Image*
