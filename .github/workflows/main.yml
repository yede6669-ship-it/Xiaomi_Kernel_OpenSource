name: Build Xiaomi Camellia Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: camellia-r-oss
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev python3 clang lld llvm

      - name: Build Kernel
        run: |
          # 1. 核心环境变量配置
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 2. 准备输出目录
          mkdir -p out
          
          # 3. 彻底清理并应用配置
          make O=out mrproper
          
          echo "正在加载配置: arch/arm64/configs/k6833v1_64_defconfig"
          make O=out k6833v1_64_defconfig
          
          # 4. 修复 Clang 高版本导致的 FTRACE 编译报错
          # 通过 scripts/config 工具关闭引起报错的追踪功能
          ./scripts/config --file out/.config -d FUNCTION_TRACER
          ./scripts/config --file out/.config -d FUNCTION_GRAPH_TRACER
          ./scripts/config --file out/.config -d STACK_TRACER
          ./scripts/config --file out/.config -d FTRACE
          ./scripts/config --file out/.config -d DYNAMIC_FTRACE
          
          # 重新同步配置文件确保生效
          make O=out olddefconfig
          
          # 5. 正式开始编译
          # 增加 -k 参数：即便遇到非致命错误也尝试继续编译其他模块
          make -j$(nproc --all) O=out \
              CC=$CC \
              CLANG_TRIPLE=$CLANG_TRIPLE \
              CROSS_COMPILE=$CROSS_COMPILE \
              CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Camellia-Kernel-${{ github.run_id }}
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
