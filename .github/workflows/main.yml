name: Build Camellia Kernel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CLANG_DIR: ${{ github.workspace }}/toolchain/clang

jobs:
  build:
    name: Build Kernel (camellia-r-oss)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: camellia-r-oss
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf \
            make bc bison build-essential ccache curl flex \
            git gnupg gperf wget tar \
            liblz4-tool libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush \
            rsync libglib2.0-dev schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip cpio kmod ca-certificates \
            zstd patchelf device-tree-compiler
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-as --version | head -1

      - name: Download Clang toolchain via AntMan
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          cd ${{ env.CLANG_DIR }}
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          bin/clang --version | head -1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: camellia-r-oss-${{ runner.os }}

      - name: Hijack system assembler (狸猫换太子)
        run: |
          # 1. 把系统原本的汇编器重命名备份
          sudo mv /usr/bin/as /usr/bin/as.orig
          
          # 2. 写一个“交通警察”脚本放到原本的位置
          cat << 'EOF' | sudo tee /usr/bin/as > /dev/null
          #!/bin/sh
          for arg in "$@"; do
            case "$arg" in
              # 如果发现手机专用的 ARM64 指令
              -EL|-EB|-mabi=*)
                exec /usr/bin/aarch64-linux-gnu-as "$@"
                ;;
            esac
          done
          # 否则，交还原来的系统汇编器处理
          exec /usr/bin/as.orig "$@"
          EOF
          
          # 3. 赋予执行权限
          sudo chmod +x /usr/bin/as
          
          echo "--- 检查伪装的汇编器 ---"
          cat /usr/bin/as

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="${{ env.CLANG_DIR }}/bin:${PATH}"

          # 明确告诉内核各个工具的具体身份
          COMMON_FLAGS="O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            AS=aarch64-linux-gnu-as \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            DTC_EXT=dtc"

          make $COMMON_FLAGS camellia_defconfig

          make $COMMON_FLAGS -j$(nproc --all) 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}

          echo "=== Build exit code: $BUILD_EXIT ==="
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== 关键错误信息 (最后 200 行) ==="
            grep -iE "error:|fatal:" build.log | head -n 100 || true
            tail -n 200 build.log
            exit $BUILD_EXIT
          fi

      - name: Check build output
        if: always()
        run: |
          ls -lh kernel/out/arch/arm64/boot/ 2>/dev/null || echo "boot dir not found"
          find kernel/out -name "Image*" 2>/dev/null || echo "No Image files found"

      - name: Upload kernel image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camellia-kernel-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          if-no-files-found: ignore
          retention-days: 3
